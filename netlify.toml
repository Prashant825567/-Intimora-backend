# Netlify configuration
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm install"
  publish = "public"

[build.environment]
  NODE_VERSION = "20"

# Serverless functions directory
# Directory function at functions/api/index.js handles all /api/* routes
[functions]
  directory = "functions"

# Route /api/* to the serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Clean URLs — redirect /admin to admin.html
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Environment variables (set in dashboard for secrets)
# TELEGRAM_API_ID
# TELEGRAM_API_HASH
# TELEGRAM_SESSION
# TELEGRAM_CHANNEL_VIDEO   (video channel ID or @username)
# TELEGRAM_CHANNEL_THUMB   (thumbnail channel ID)
# TELEGRAM_CHANNEL_META    (metadata channel ID)
# TELEGRAM_CHANNEL_PUBLIC  (video channel's public username WITHOUT @, e.g. "intimoravid")
# ADMIN_API_KEY
