<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intimora Local Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
      color: #e0e0e0;
      padding: 20px;
      min-height: 100vh;
    }
    .container { max-width: 600px; margin: 0 auto; }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 25px;
      background: linear-gradient(90deg, #4fc3f7, #81d4fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .card {
      background: rgba(26, 26, 26, 0.9);
      border: 1px solid #333;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }
    .card-title {
      font-size: 1.2rem;
      margin-bottom: 20px;
      color: #81d4fa;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 6px;
      font-weight: 500;
    }
    input, textarea, select {
      width: 100%;
      padding: 12px 14px;
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 10px;
      color: #e0e0e0;
      font-size: 0.9rem;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #4fc3f7;
    }
    input[type="file"] {
      padding: 10px;
      border: 2px dashed #444;
      cursor: pointer;
    }
    input[type="file"]::file-selector-button {
      padding: 8px 16px;
      background: #333;
      border: none;
      border-radius: 8px;
      color: #e0e0e0;
      cursor: pointer;
      margin-right: 12px;
    }
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #4fc3f7, #29b6f6);
      color: #0f0f0f;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(79,195,247,0.3); }
    .btn-secondary { background: #333; color: #e0e0e0; }
    .btn-secondary:hover { background: #444; }
    .btn-danger { background: #ef5350; color: white; }
    .btn-danger:hover { background: #e53935; }
    .btn-sm { padding: 8px 14px; font-size: 0.8rem; }
    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
    .status {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 16px;
    }
    .status-success { background: #1b5e20; color: #a5d6a7; }
    .status-error { background: #b71c1c; color: #ef9a9a; }
    .status-info { background: #01579b; color: #90caf9; }
    .status-loading { background: #4a3f00; color: #ffe082; }

    /* Progress */
    .progress-container {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      margin-top: 16px;
      display: none;
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .progress-label { font-size: 0.9rem; color: #aaa; font-weight: 500; }
    .progress-percent {
      font-size: 1.4rem;
      font-weight: 700;
      color: #4fc3f7;
    }
    .progress-bar-bg {
      height: 16px;
      background: #2a2a2a;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #4fc3f7, #29b6f6);
      border-radius: 8px;
      transition: width 0.3s ease;
      width: 0%;
    }
    .progress-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 14px;
    }
    .stat-box {
      background: #2a2a2a;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }
    .stat-label { font-size: 0.7rem; color: #666; margin-bottom: 4px; }
    .stat-value { font-size: 0.95rem; color: #e0e0e0; font-weight: 600; }
    .stat-value.speed { color: #4fc3f7; }
    .stat-value.eta { color: #ffb74d; }
    .stat-value.size { color: #81c784; }

    /* Video List */
    .video-list { margin-top: 10px; }
    .video-item {
      background: #252525;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: border-color 0.2s;
    }
    .video-item:hover { border-color: #4fc3f7; }
    .video-item-info { flex: 1; }
    .video-item-title { font-size: 0.95rem; font-weight: 600; }
    .video-item-meta { font-size: 0.75rem; color: #888; margin-top: 3px; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 600;
      margin-left: 6px;
    }
    .badge-exclusive { background: #4a148c; color: #ce93d8; }
    .badge-public { background: #1b5e20; color: #a5d6a7; }
    .badge-fs { background: #1565c0; color: #90caf9; }
    .divider { height: 1px; background: #333; margin: 20px 0; }
    .empty { text-align: center; color: #666; padding: 30px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 Intimora Local Admin</h1>
    <div id="ffmpegStatus" class="status" style="display:none;"></div>
    <div id="status" class="status status-info" style="display:none;"></div>

    <!-- Upload -->
    <div class="card">
      <div class="card-title">⬆️ Upload Video</div>
      <label>Title</label>
      <input type="text" id="title" placeholder="Video title">
      <label>Description</label>
      <textarea id="description" rows="2" placeholder="Video description"></textarea>
      <label>Duration (seconds)</label>
      <input type="number" id="duration" placeholder="e.g. 120">
      <label>Exclusive Content</label>
      <select id="exclusive">
        <option value="false">Non-Exclusive (Public)</option>
        <option value="true">Exclusive (Premium) 🔒</option>
      </select>
      <label>Video File</label>
      <input type="file" id="videoFile" accept="video/*">
      <label>Thumbnail (compulsory)</label>
      <input type="file" id="thumbFile" accept="image/*">

      <div class="progress-container" id="progressContainer">
        <div class="progress-header">
          <span class="progress-label" id="progressStep">Upload Progress</span>
          <span class="progress-percent" id="progressPercent">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressBar"></div>
        </div>
        <div class="progress-stats">
          <div class="stat-box">
            <div class="stat-label">Uploaded</div>
            <div class="stat-value size" id="statSize">0 B</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Speed</div>
            <div class="stat-value speed" id="statSpeed">—</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">ETA</div>
            <div class="stat-value eta" id="statEta">—</div>
          </div>
        </div>
      </div>

      <div class="btn-group" style="margin-top:20px;">
        <button class="btn-primary" onclick="uploadVideo()">Upload to Telegram</button>
      </div>
    </div>

    <!-- Video List -->
    <div class="card">
      <div class="card-title">📋 Uploaded Videos</div>
      <div class="btn-group" style="margin-bottom:16px;">
        <button class="btn-secondary btn-sm" onclick="loadVideos()">Refresh</button>
        <button class="btn-secondary btn-sm" onclick="syncVideos()">📡 Sync from Telegram</button>
        <button class="btn-secondary btn-sm" onclick="exportMetadata()">Export JSON</button>
      </div>
      <div class="video-list" id="videoList"></div>
    </div>
  </div>

<script>
function showStatus(msg, type = 'info') {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = `status status-${type}`;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 8000);
}

function formatBytes(bytes) {
  if (!bytes || bytes === 0) return '0 B';
  const k = 1024;
  const sizes = ['B', 'KB', 'MB', 'GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
}

async function loadVideos() {
  try {
    const res = await fetch('/api/videos');
    const data = await res.json();
    const list = document.getElementById('videoList');
    const videos = data.data.videos || [];
    if (videos.length === 0) {
      list.innerHTML = '<div class="empty">No videos uploaded yet</div>';
      return;
    }
    list.innerHTML = videos.map(v => {
      const title = v.title || v.video?.tg_filename || 'Untitled';
      const size = v.video?.tg_size ? (v.video.tg_size / 1024).toFixed(1) + ' KB' : 'Unknown';
      const duration = v.duration ? v.duration + 's' : '0s';
      const date = v.createdAt && v.createdAt > 0 ? new Date(v.createdAt * 1000).toLocaleDateString() : 'Unknown';
      const badge = v.exclusive ? '<span class="badge badge-exclusive">🔒 Exclusive</span>' : '<span class="badge badge-public">Public</span>';
      const fastStartBadge = v.is_fast_start ? ' <span class="badge badge-fs">⚡ Fast-start</span>' : '';
      const reprocessBtn = `<button class="btn-secondary btn-sm" onclick="reprocessVideo('${v.id}')">🔄 Re-process</button>`;
      return `
      <div class="video-item">
        <div class="video-item-info">
          <div class="video-item-title">${title} ${badge}${fastStartBadge}</div>
          <div class="video-item-meta">${size} · ${duration} · ${date}</div>
        </div>
        ${reprocessBtn}
        <button class="btn-danger btn-sm" onclick="deleteVideo('${v.id}')">Delete</button>
      </div>`;
    }).join('');
  } catch (e) {
    showStatus('Error loading videos: ' + e.message, 'error');
  }
}

async function checkFFmpeg() {
  try {
    const res = await fetch('/api/ffmpeg-status');
    const data = await res.json();
    const el = document.getElementById('ffmpegStatus');
    if (data.data.available) {
      el.textContent = '✅ FFmpeg ready — videos will be optimized for fast streaming';
      el.className = 'status status-success';
    } else {
      el.textContent = '⚠️ FFmpeg not found — some videos may buffer on playback';
      el.className = 'status status-error';
    }
    el.style.display = 'block';
  } catch {}
}

async function uploadVideo() {
  const title = document.getElementById('title').value;
  const description = document.getElementById('description').value;
  const duration = document.getElementById('duration').value;
  const exclusive = document.getElementById('exclusive').value;
  const videoFile = document.getElementById('videoFile').files[0];
  const thumbFile = document.getElementById('thumbFile').files[0];

  if (!title) { showStatus('Enter title', 'error'); return; }
  if (!videoFile) { showStatus('Select video file', 'error'); return; }
  if (!thumbFile) { showStatus('Thumbnail is compulsory', 'error'); return; }

  showStatus('Checking & processing...', 'loading');
  document.getElementById('progressContainer').style.display = 'block';
  document.getElementById('progressBar').style.width = '5%';
  document.getElementById('progressPercent').textContent = '5%';
  document.getElementById('progressStep').textContent = 'Checking file...';

  const formData = new FormData();
  formData.append('title', title);
  formData.append('description', description);
  formData.append('duration', duration);
  formData.append('exclusive', exclusive);
  formData.append('video', videoFile);
  formData.append('thumb', thumbFile);

  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/upload');
  const startTime = Date.now();

  xhr.upload.onprogress = (e) => {
    if (e.lengthComputable) {
      const percent = Math.round((e.loaded / e.total) * 100);
      document.getElementById('progressBar').style.width = percent + '%';
      document.getElementById('progressPercent').textContent = percent + '%';
      document.getElementById('progressStep').textContent = 'Uploading to Telegram...';
      const elapsed = (Date.now() - startTime) / 1000;
      const speed = elapsed > 0 ? e.loaded / elapsed : 0;
      const speedStr = speed > 1024 * 1024 ? (speed / 1024 / 1024).toFixed(2) + ' MB/s' : (speed / 1024).toFixed(2) + ' KB/s';
      const remaining = e.total - e.loaded;
      const eta = speed > 0 ? Math.round(remaining / speed) : 0;
      document.getElementById('statSize').textContent = formatBytes(e.loaded) + ' / ' + formatBytes(e.total);
      document.getElementById('statSpeed').textContent = speedStr;
      document.getElementById('statEta').textContent = eta + 's';
    }
  };

  xhr.onload = () => {
    try {
      const data = JSON.parse(xhr.responseText);
      if (data.ok) {
        document.getElementById('progressBar').style.width = '100%';
        document.getElementById('progressPercent').textContent = '100%';
        document.getElementById('statSpeed').textContent = 'Done!';
        document.getElementById('statEta').textContent = '✓';
        showStatus('Upload successful! ✅', 'success');
        document.getElementById('title').value = '';
        document.getElementById('description').value = '';
        document.getElementById('duration').value = '';
        document.getElementById('exclusive').value = 'false';
        document.getElementById('videoFile').value = '';
        document.getElementById('thumbFile').value = '';
        setTimeout(() => {
          document.getElementById('progressContainer').style.display = 'none';
          document.getElementById('progressBar').style.width = '0%';
          document.getElementById('progressPercent').textContent = '0%';
          document.getElementById('progressStep').textContent = 'Upload Progress';
          document.getElementById('statSize').textContent = '0 B';
          document.getElementById('statSpeed').textContent = '—';
          document.getElementById('statEta').textContent = '—';
        }, 2000);
        loadVideos();
      } else {
        showStatus('Error: ' + data.error, 'error');
        document.getElementById('progressContainer').style.display = 'none';
      }
    } catch (e) {
      showStatus('Error: ' + e.message, 'error');
      document.getElementById('progressContainer').style.display = 'none';
    }
  };

  xhr.onerror = () => {
    showStatus('Network error during upload', 'error');
    document.getElementById('progressContainer').style.display = 'none';
  };

  xhr.send(formData);
}

async function syncVideos() {
  showStatus('Syncing videos from Telegram...', 'loading');
  try {
    const res = await fetch('/api/sync-videos', { method: 'POST' });
    const data = await res.json();
    if (data.ok) {
      showStatus(`Sync complete! ${data.data.added} new videos added. ${data.data.total} total.`, 'success');
      loadVideos();
    } else {
      showStatus('Error: ' + data.error, 'error');
    }
  } catch (e) {
    showStatus('Error: ' + e.message, 'error');
  }
}

async function reprocessVideo(id) {
  showStatus('Re-processing video... This may take a few minutes', 'loading');
  try {
    const res = await fetch('/api/reprocess/' + id, { method: 'POST' });
    const data = await res.json();
    if (data.ok) {
      showStatus(data.message || 'Re-processed successfully! ✅', 'success');
      loadVideos();
    } else {
      showStatus('Error: ' + data.error, 'error');
    }
  } catch (e) {
    showStatus('Error: ' + e.message, 'error');
  }
}

async function deleteVideo(id) {
  await fetch('/api/delete/' + id, { method: 'POST' });
  showStatus('Deleted', 'info');
  loadVideos();
}

function exportMetadata() {
  fetch('/api/export').then(res => {
    const filename = 'intimora-metadata.json';
    res.blob().then(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
      showStatus('Exported!', 'success');
    });
  });
}

loadVideos();
checkFFmpeg();
</script>
</body>
</html>
